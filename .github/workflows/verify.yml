name: Verify offline handoff
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B scripts/verify_release.py
      - run: python -B mock/verify_cost_scenarios.py
      - run: python -B -m unittest discover -s runtime/tests -v
      - run: python -B -m unittest discover -s support/tests -v
      - run: python -B mock/run_mock.py --paths-per-family 1 --seed ci-diagnostic-seed --output "$RUNNER_TEMP/nfb-mock"
      - run: python -B mock/reconcile_receipts.py --mock-root "$RUNNER_TEMP/nfb-mock" --output "$RUNNER_TEMP/nfb-ledger"
